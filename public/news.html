<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kripto Haberleri — Coin Terminal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#131722">
  <style>
    .news-wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
    .news-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .news-head h1 { font-size: 22px; }
    .news-back { color: var(--blue-light); text-decoration: none; font-size: 14px; }
    .news-list { display: flex; flex-direction: column; gap: 12px; }
    .news-card {
      display: flex; gap: 16px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
      text-decoration: none; color: var(--text);
      transition: border-color .15s, transform .15s;
    }
    .news-card:hover { border-color: var(--blue-light); transform: translateY(-1px); }
    .news-img { width: 110px; height: 80px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--panel2); }
    .news-body { flex: 1; min-width: 0; }
    .news-title { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.4; margin-bottom: 6px; }
    .news-excerpt { font-size: 13px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: box; overflow: hidden; }
    .news-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: var(--muted); }
    .news-source { color: var(--blue-light); font-weight: 700; }
    .news-loading, .news-error { text-align: center; padding: 60px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">COIN TERMINAL</span>
      <span class="brand-sub">Haberler</span>
    </div>
    <a href="/" class="nav-link">← Terminale Dön</a>
    <button id="refreshBtn" class="btn-scan">YENİLE</button>
  </header>

  <div class="news-wrap">
    <div id="newsLoading" class="news-loading">Haberler yükleniyor...</div>
    <div id="newsError" class="news-error" style="display:none"></div>
    <div id="newsList" class="news-list"></div>
  </div>

  <script>
    const list = document.getElementById('newsList');
    const loading = document.getElementById('newsLoading');
    const errorBox = document.getElementById('newsError');

    function timeAgo(ts) {
      const diff = Date.now() - ts;
      const m = Math.floor(diff / 60000);
      if (m < 60) return m + ' dk önce';
      const h = Math.floor(m / 60);
      if (h < 24) return h + ' sa önce';
      return Math.floor(h / 24) + ' gün önce';
    }

    async function loadNews() {
      loading.style.display = 'block';
      errorBox.style.display = 'none';
      try {
        const res = await fetch('/api/news?limit=40');
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        list.innerHTML = json.data.map(n => `
          <a class="news-card" href="${n.url}" target="_blank" rel="noopener">
            ${n.image ? `<img class="news-img" src="${n.image}" onerror="this.style.display='none'">` : ''}
            <div class="news-body">
              <div class="news-title">${n.title}</div>
              <div class="news-excerpt">${n.body}</div>
              <div class="news-meta">
                <span class="news-source">${n.source}</span>
                <span>${timeAgo(n.published)}</span>
              </div>
            </div>
          </a>`).join('');
      } catch (e) {
        errorBox.textContent = 'Haberler alınamadı: ' + e.message;
        errorBox.style.display = 'block';
      } finally {
        loading.style.display = 'none';
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadNews);
    loadNews();
  </script>
</body>
</html>
